name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動実行できるようにする
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に複数のデプロイが走らないようにする（進行中のデプロイは中断しない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build network.json (fixture data)
        # NOTE: 現時点では ODPT_TOKEN が未取得のため、フィクスチャ（ミニGTFS）データで
        # デプロイする。実データに切り替える手順は README.md の「実データ利用手順」を参照。
        # トークン取得後は、リポジトリの Secrets に ODPT_TOKEN を設定した上で、
        # このステップを次の2ステップに置き換える:
        #   - run: npm run fetch:gtfs -- --list
        #   - run: npm run fetch:gtfs
        #     env:
        #       ODPT_TOKEN: ${{ secrets.ODPT_TOKEN }}
        #   - run: npm run build:network
        run: npm run build:network -- --fixture

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
